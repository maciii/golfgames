name: Build & Deploy

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Souběžné deploye by si přepisovaly výsledek; rozdělané necháme doběhnout.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Kontrola typů
        run: npm run typecheck
      - name: Testy pravidel her
        run: npm run test
      - name: Kontrola formátování
        run: npm run format:check

      # Vypíše, co z konfigurace Firebase dorazilo. Hodnoty se netisknou, jen
      # jestli jsou vyplněné - bez toho se nedá poznat, proč v aplikaci chybí
      # přihlášení.
      - name: Kontrola konfigurace Firebase
        env:
          API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY || vars.VITE_FIREBASE_API_KEY }}
          AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN || vars.VITE_FIREBASE_AUTH_DOMAIN }}
          PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID || vars.VITE_FIREBASE_PROJECT_ID }}
          APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID || vars.VITE_FIREBASE_APP_ID }}
        run: |
          missing=0
          for name in API_KEY AUTH_DOMAIN PROJECT_ID APP_ID; do
            value="${!name}"
            if [ -n "$value" ]; then
              # Vypisuje se jen délka, ať se hodnota nedostane do logu.
              echo "VITE_FIREBASE_$name: vyplněno, ${#value} znaků"
            else
              echo "VITE_FIREBASE_$name: CHYBÍ"
              missing=1
            fi
          done
          if [ "$missing" = "1" ]; then
            echo ""
            echo "Synchronizace bude v nasazené aplikaci vypnutá."
            echo "Doplň chybějící hodnoty v Settings -> Secrets and variables -> Actions."
            echo "Musí být na úrovni repozitáře (záložka Secrets nebo Variables),"
            echo "ne v konkrétním Environment - ten build job nevidí."
          fi

      - name: Build
        run: npm run build
        # Konfigurace Firebase pro synchronizaci. Bere se ze Secrets i Variables:
        # tyhle údaje nejsou tajné (u Firebase jsou veřejné z principu), takže
        # je jedno, kam si je uživatel uložil.
        env:
          # Adresa katalogu hřišť. Prázdná hodnota (typicky ve forku, kam se
          # repository variables nedědí) není chyba - aplikace pak sáhne po
          # katalogu projektu, který má jako výchozí (viz docs/katalog.md).
          VITE_COURSES_URL: ${{ vars.VITE_COURSES_URL }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY || vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN || vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID || vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID || vars.VITE_FIREBASE_APP_ID }}

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Pojistka proti zaseknutému běhu. Delší čekání na Pages tím ale nezařídíš:
    # `actions/deploy-pages` má vlastní strop 600 000 ms (10 minut) a vyšší
    # hodnotu vstupu `timeout` beze slova ořízne zpátky na maximum. Když
    # nasazení uvízne ve stavu `deployment_in_progress`, je to na straně služby
    # a z workflow se to vyčkat nedá.
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
