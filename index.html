<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover + safe-area insety v CSS kvůli výřezu a home indikátoru -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"
    />
    <meta name="theme-color" content="#0f1c14" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Fairsome" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <title>Fairsome</title>
    <!-- Inline, aby úvodní obrazovka vypadala k světu i když se hlavní
         stylopis nenačte. -->
    <style>
      body {
        margin: 0;
        background: #0f1c14;
        color: #eef4ef;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .boot {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        gap: 8px;
        padding: 24px;
        text-align: center;
      }
      .boot-title {
        margin: 0;
        font-size: 22px;
        font-weight: 650;
      }
      .boot-note {
        margin: 0;
        font-size: 14px;
        color: #9fb4a6;
      }
    </style>
  </head>
  <body>
    <!-- React tenhle obsah při připojení přepíše; když se ale skript vůbec
         nenačte, zůstane místo prázdné stránky aspoň vysvětlení.

         Texty jsou dvojjazyčné: tahle část běží dřív, než se vůbec načte
         aplikace, takže se tu nedá zjistit zvolený jazyk. -->
    <div id="root">
      <div class="boot">
        <p class="boot-title">Fairsome</p>
        <p class="boot-note" id="boot-note">Načítám… · Loading…</p>
      </div>
    </div>
    <script>
      setTimeout(function () {
        var note = document.getElementById('boot-note')
        if (note) {
          note.textContent =
            'Aplikaci se nepodařilo načíst, zkus obnovit stránku. · ' +
            'The app failed to load, please refresh the page.'
        }
      }, 6000)
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
